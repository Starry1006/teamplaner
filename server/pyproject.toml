[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "teamplaner-server"
dynamic = ["version"]
description = "Teamplaner – Server für Termine, Mitglieder, Kasse und Umfragen"
requires-python = ">=3.12"
authors = [{ name = "Thomas Helm – IT-Service Helm" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
teamplaner-server = "teamplaner_server.cli:main"

[tool.setuptools.dynamic]
version = { attr = "teamplaner_server.__version__" }

[tool.setuptools.packages.find]
include = ["teamplaner_server*"]

[tool.setuptools.package-data]
"teamplaner_server" = ["alembic.ini", "migrationen/*.py", "migrationen/*.mako", "migrationen/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
