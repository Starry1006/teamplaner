name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tp
          POSTGRES_PASSWORD: tp
          POSTGRES_DB: tp_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests mit SQLite
        run: pytest -q
      - name: Migrationen auf leerem PostgreSQL
        run: teamplaner-server migrieren
        env:
          TEAMPLANER_DB: postgresql+psycopg://tp:tp@localhost/tp_test
      - name: Tests mit PostgreSQL
        run: pytest -q
        env:
          TEAMPLANER_TEST_DB: postgresql+psycopg://tp:tp@localhost/tp_test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: teamplaner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
